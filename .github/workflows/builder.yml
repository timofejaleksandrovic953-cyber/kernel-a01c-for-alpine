name: Build A01 Core Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: timofejaleksandrovic953-cyber/kernel-a01c-for-alpine
        ref: main

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          bc bison flex libssl-dev \
          make python3 git \
          perl libxml-simple-perl libxml-libxml-perl \
          libparse-yapp-perl libdbi-perl
    
    - name: Prepare kernel config
      run: |
        cp a01core.config .config
        # Пути к header-файлам драйвера
        scripts/config --file .config --set-str GT1151_FIRMWARE "firmware1"
        scripts/config --file .config --set-str GT1151_CONFIG "config1"
        scripts/config --file .config --enable GTP_CUSTOM_CFG
        scripts/config --file .config --enable GTP_AUTO_UPDATE
        scripts/config --file .config --enable GTP_POWER_CTRL_SLEEP
        # Отключаем Android-специфичный mrdump — не нужен для Alpine
        scripts/config --file .config --disable MTK_AEE_MRDUMP
        scripts/config --file .config --disable MTK_AEE_IPANIC
        scripts/config --file .config --disable MTK_AEE_AED
        # Включаем CONFIG_GTP_CUSTOM_CFG — определяет GTP_INT_TRIGGER и GTP_WAKEUP_LEVEL
        scripts/config --file .config --enable GTP_CUSTOM_CFG
        # Проверяем, что всё записалось
        grep -E "GT1151|GTP_CUSTOM" .config
        make ARCH=arm64 olddefconfig
        # Проверяем ещё раз — olddefconfig не должен откатить
        grep -E "GT1151|GTP_CUSTOM" .config

    - name: Patch ComboA Makefile for autok.h
      run: |
        MF="drivers/mmc/host/mediatek/ComboA/Makefile"
        # Проверим содержимое
        echo "=== Current ComboA/Makefile ==="
        cat "$MF"
        echo
        # Добавляем -I на директорию ComboA, чтобы autok.h был виден из mt6739/
        if ! grep -q "ComboA/\"$" "$MF"; then
          echo 'ccflags-y += -I$(srctree)/drivers/mmc/host/mediatek/ComboA/' >> "$MF"
        fi
        echo "=== After patch ==="
        cat "$MF"

    - name: Patch mrdump Makefile for mrdump_private.h
      run: |
        MF="drivers/misc/mediatek/aee/mrdump/Makefile"
        echo "=== Before ==="
        cat "$MF"
        # Добавляем -I на текущую директорию mrdump
        # Используем subdir-ccflags-y, чтобы флаг попал во все объекты mrdump
        if ! grep -q "drivers/misc/mediatek/aee/mrdump" "$MF"; then
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/aee/mrdump/' >> "$MF"
        fi
        echo "=== After ==="
        cat "$MF"

    - name: Patch ppm_v3 Makefile
      run: |
        # Ищем Makefile PPM
        find drivers/misc/mediatek/base/power/ppm_v3/ -name "Makefile" | head
        MF="drivers/misc/mediatek/base/power/ppm_v3/Makefile"
        if [ -f "$MF" ]; then
          if ! grep -q "ppm_v3/src/mach/mt6739" "$MF"; then
            echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6739/' >> "$MF"
          fi
          cat "$MF"
        fi

    - name: Add global MTK include paths
      run: |
        cat >> Makefile << 'EOF'
        # Alpine port: extra MTK include paths (added automatically)
        KBUILD_CFLAGS += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6739/
        KBUILD_CFLAGS += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/inc/
        KBUILD_CFLAGS += -I$(srctree)/drivers/misc/mediatek/base/power/include/
        KBUILD_CFLAGS += -I$(srctree)/drivers/misc/mediatek/include/
        KBUILD_CFLAGS += -I$(srctree)/drivers/misc/mediatek/include/mt-plat/
        KBUILD_CFLAGS += -I$(srctree)/drivers/misc/mediatek/include/mt-plat/mt6739/include/
        EOF
    
    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KCFLAGS="-Wno-error=array-bounds \
                        -Wno-error=implicit-function-declaration \
                        -Wno-error=array-compare \
                        -Wno-error=unused-variable \
                        -Wno-error=zero-length-bounds \
                        -Wno-error=stringop-overflow \
                        -Wno-error=stringop-overread \
                        -Wno-error=stringop-truncation \
                        -Wno-error=format-truncation \
                        -Wno-error=maybe-uninitialized \
                        -Wno-error=misleading-indentation \
                        -Wno-error=dangling-pointer \
                        -Wno-error=address \
                        -Wno-error=shift-negative-value \
                        -Wno-error=unused-but-set-variable \
                        -Wno-error=restrict \
                        -Wno-error=undef \
                        -Wno-error=enum-int-mismatch"
        make -j$(nproc) Image.gz-dtb

    - name: Build kernel modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) modules

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: a01core-kernel
        path: |
          arch/arm64/boot/Image.gz-dtb
          drivers/input/touchscreen/**/*.ko
