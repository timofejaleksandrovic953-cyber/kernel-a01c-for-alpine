name: Build A01 Core Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: timofejaleksandrovic953-cyber/kernel-a01c-for-alpine
        ref: main

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          bc bison flex libssl-dev \
          make python3 git \
          perl libxml-simple-perl libxml-libxml-perl \
          libparse-yapp-perl libdbi-perl
    
    - name: Prepare kernel config
      run: |
        cp a01core.config .config
        # Задаём значения для путей драйвера GT1151
        scripts/config --file .config --set-str GT1151_FIRMWARE "firmware1"
        scripts/config --file .config --set-str GT1151_CONFIG "config1"
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KCFLAGS="-Wno-error=implicit-function-declaration"
        # Проверяем, что значения записались
        grep -E "GT1151" .config
        # Применяем конфиг к исходникам
        make ARCH=arm64 olddefconfig
        # Проверяем, что olddefconfig не откатил строковые опции
        grep -E "GT1151" .config
    
    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KCFLAGS="-Wno-error=array-bounds \
                        -Wno-error=implicit-function-declaration \
                        -Wno-error=array-compare \
                        -Wno-error=unused-variable \
                        -Wno-error=zero-length-bounds \
                        -Wno-error=stringop-overflow \
                        -Wno-error=stringop-overread \
                        -Wno-error=stringop-truncation \
                        -Wno-error=format-truncation \
                        -Wno-error=maybe-uninitialized \
                        -Wno-error=misleading-indentation \
                        -Wno-error=dangling-pointer \
                        -Wno-error=address \
                        -Wno-error=shift-negative-value \
                        -Wno-error=unused-but-set-variable \
                        -Wno-error=restrict"
        make -j$(nproc) Image.gz-dtb

    - name: Build kernel modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) modules

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: a01core-kernel
        path: |
          arch/arm64/boot/Image.gz-dtb
          drivers/input/touchscreen/**/*.ko
