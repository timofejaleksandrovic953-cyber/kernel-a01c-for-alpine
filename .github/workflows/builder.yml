name: Build A01 Core Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: timofejaleksandrovic953-cyber/kernel-a01c-for-alpine
        ref: main

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          bc bison flex libssl-dev \
          make python3 git

    - name: Apply device config
      run: |
        cp a01core.config .config
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # Проверяем, что .config на месте
        # Адаптируем конфиг под текущие исходники ядра
        make ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) Image.gz-dtb

    - name: Build kernel modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) modules

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: a01core-kernel
        path: |
          arch/arm64/boot/Image.gz-dtb
          drivers/input/touchscreen/**/*.ko
