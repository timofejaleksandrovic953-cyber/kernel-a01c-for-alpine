name: Build A01 Core Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: timofejaleksandrovic953-cyber/kernel-a01c-for-alpine
        ref: main

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev \
          make python3 git wget xz-utils \
          perl libxml-simple-perl libxml-libxml-perl \
          libparse-yapp-perl libdbi-perl

    - name: Download old GCC 4.9 toolchain (AOSP prebuilt)
      run: |
        # AOSP prebuilt GCC 4.9 для aarch64 — стандарт для MTK-ядер 4.x
        # (Linaro переехал, их старые URL отдают HTML вместо tar.xz)
        git clone --depth=1 \
          https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
        
        TOOLCHAIN_DIR="$(pwd)/aarch64-linux-android-4.9/bin"
        echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> $GITHUB_ENV
        
        echo "=== Binaries ==="
        ls "$TOOLCHAIN_DIR/" | head -10
        echo "=== GCC version ==="
        "$TOOLCHAIN_DIR/aarch64-linux-android-gcc" --version | head -1

    - name: Clean working tree
      run: |
        rm -rf include/config include/generated
        rm -rf arch/arm64/boot/Image*
        rm -f .config .config.old .version
        rm -f Module.symvers modules.order build.log
        find . -name "*.o" -not -path "./.git/*" -delete 2>/dev/null || true
        find . -name "*.cmd" -not -path "./.git/*" -delete 2>/dev/null || true
        find . -name "*.mod.c" -not -path "./.git/*" -delete 2>/dev/null || true
        echo "=== Cleaned ==="
        ls -la | head -10

    # ============================================================
    # КРИТИЧНО: удаление директорий и патч Kconfig должны быть
    # ДО olddefconfig, иначе kconfig-парсер упадёт на source "...Kconfig"
    # ============================================================
    - name: Remove non-essential dirs + patch Kconfig
      run: |
        # === 1. Удаляем ненужные директории ===
        # GPU — не работает в Alpine без Android HAL
        rm -rf drivers/misc/mediatek/gpu/
        # Модем — звонки всё равно не работают без Android-стека
        rm -rf drivers/misc/mediatek/eccci/
        rm -rf drivers/misc/mediatek/ccci_util/
        rm -rf drivers/misc/mediatek/modem/
        # MTK cpufreq — заменяется стандартным Linux cpufreq
        rm -rf drivers/misc/mediatek/base/power/cpufreq_v1/
        rm -rf drivers/misc/mediatek/base/power/cpufreq_v2/
        rm -rf drivers/misc/mediatek/base/power/mt_cpufreq/
        rm -rf drivers/misc/mediatek/base/power/mt_cpufreq_hybrid/
        rm -rf drivers/misc/mediatek/base/power/mt_cpufreq_hw/
        
        # === 2. Комментируем ВСЕ ссылки на удалённые Kconfig ===
        for kf in $(find drivers -name "Kconfig" 2>/dev/null); do
          sed -i '/mediatek\/gpu\/Kconfig/ s|^|# |' "$kf"
          sed -i '/mediatek\/eccci\/Kconfig/ s|^|# |' "$kf"
          sed -i '/mediatek\/ccci_util\/Kconfig/ s|^|# |' "$kf"
          sed -i '/mediatek\/modem\/Kconfig/ s|^|# |' "$kf"
          sed -i '/cpufreq_v[12]\/Kconfig/ s|^|# |' "$kf"
          sed -i '/mt_cpufreq.*\/Kconfig/ s|^|# |' "$kf"
        done
        
        # === 3. Убираем obj-y ссылки из Makefile ===
        MF="drivers/misc/mediatek/Makefile"
        if [ -f "$MF" ]; then
          sed -i '/eccci/d; /ccci_util/d; /modem/d; /gpu\//d' "$MF"
        fi
        MF2="drivers/misc/mediatek/base/power/Makefile"
        if [ -f "$MF2" ]; then
          sed -i '/cpufreq/d' "$MF2"
        fi
        
        # === 4. Проверка ===
        echo "=== Remaining Kconfig refs to removed dirs ==="
        grep -rn "mediatek/\(gpu\|eccci\|ccci_util\|modem\)/Kconfig\|cpufreq_v[12]/Kconfig" drivers/ 2>/dev/null || echo "clean"

    - name: Prepare kernel config
      run: |
        cp a01core.config .config

        # === Тачскрин GT1151 ===
        scripts/config --file .config --set-str GT1151_FIRMWARE "firmware1"
        scripts/config --file .config --set-str GT1151_CONFIG  "config1"
        scripts/config --file .config --enable GTP_CUSTOM_CFG
        scripts/config --file .config --enable GTP_AUTO_UPDATE
        scripts/config --file .config --enable GTP_POWER_CTRL_SLEEP

        # === Отключаем Android-only ===
        for opt in MTK_AEE_MRDUMP MTK_AEE_IPANIC MTK_AEE_AED \
                   SEC_DEBUG SEC_DEBUG_2 SEC_DEBUG_USER \
                   SEC_DEBUG_EXTRA_INFO SEC_DEBUG_PANIC_ALWAYS \
                   SEC_DEBUG_SOFTLOCKUP_DETECTOR; do
          scripts/config --file .config --disable "$opt" 2>/dev/null || true
        done

        # === Модем и cpufreq не нужны ===
        for opt in MTK_CCCI_DRIVER MTK_CCCI_DRIVER_MTK MTK_MD_CCIF \
                   MTK_RILD MTK_MD_POWER_OFF MTK_MODEM_SUPPORT \
                   MTK_CCCI_OPT MTK_MD1_SUPPORT MTK_MD2_SUPPORT \
                   MTK_CCCI_FS MTK_MD_CCIF_DRV \
                   MTK_CPU_FREQ MTK_CPU_FREQ_V1 MTK_CPU_FREQ_V2 \
                   MTK_CPUFREQ_SUPPORT MTK_CPU_FREQ_HW \
                   MTK_CPUFREQ_HYBRID MTK_CPUFREQ_PPM; do
          scripts/config --file .config --disable "$opt" 2>/dev/null || true
        done

        # === LOCALVERSION без пробелов ===
        scripts/config --file .config --set-str LOCALVERSION "-a01core"

        make ARCH=arm64 olddefconfig

        echo "=== Final config check ==="
        grep -E "GT1151|GTP_CUSTOM|MTK_AEE|MTK_CCCI|LOCALVERSION" .config || true

    - name: Patch pinctrl include
      run: |
        F="drivers/pinctrl/mediatek/pinctrl-mtk-common-v2_debug.c"
        echo "=== Before ==="; grep -n 'gpiolib' "$F" || true
        sed -i 's|^#include *[<"]\.\./\.\./gpio/gpiolib\.h[>"].*|#include <linux/gpio/driver.h>|' "$F"
        echo "=== After ==="; grep -n 'gpiolib\|linux/gpio/driver' "$F" || true

    - name: Drop pinctrl debug file from build
      run: |
        MF="drivers/pinctrl/mediatek/Makefile"
        echo "=== Before ==="; grep "PARIS" "$MF"
        sed -i 's| pinctrl-mtk-common-v2_debug\.o||' "$MF"
        echo "=== After ==="; grep "PARIS" "$MF"

    - name: Fix rpmb-mtk.c (mmc_queue definition)
      run: |
        F="drivers/char/rpmb/rpmb-mtk.c"
        echo "=== Before ==="
        grep -n "mmc/core/queue.h" "$F" || echo "include not present"
        # Добавляем приватный заголовок из MMC-стека
        grep -q "mmc/core/queue.h" "$F" || \
          sed -i '/#include <linux\/device.h>/a #include "../../mmc/core/queue.h"' "$F"
        echo "=== After ==="
        grep -n 'queue.h' "$F" || true

    - name: Fix all TRACE_INCLUDE_PATH dots
      run: |
        FILES=$(grep -rl '^#define TRACE_INCLUDE_PATH \.$' \
                drivers/misc/mediatek/ sound/ 2>/dev/null || true)
        
        if [ -z "$FILES" ]; then
          echo "No files with TRACE_INCLUDE_PATH . — OK"
        else
          echo "$FILES" | while read -r f; do
            DIR=$(dirname "$f")
            echo "Patching: $f → $DIR"
            sed -i "s|^#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH $DIR|" "$f"
          done
        fi
        
        echo "=== Verify ==="
        echo "$FILES" | while read -r f; do
          [ -n "$f" ] && grep -n "TRACE_INCLUDE_PATH" "$f"
        done

    - name: Auto-collect MTK include paths
      run: |
        # Находим все .h в MTK-областях и добавляем их директории в KBUILD_CFLAGS
        find drivers/misc/mediatek drivers/staging/android/ion \
             sound/soc/mediatek drivers/mmc/host/mediatek \
             drivers/pinctrl/mediatek \
             -type f -name "*.h" 2>/dev/null \
          | xargs -n1 dirname | sort -u > /tmp/mtk_all.txt
        
        # Убираем мусорные пути
        grep -vE "Documentation|/tools/|/test" /tmp/mtk_all.txt > /tmp/mtk_clean.txt || cp /tmp/mtk_all.txt /tmp/mtk_clean.txt
        
        TOTAL=$(wc -l < /tmp/mtk_clean.txt)
        echo "Found $TOTAL directories with headers"
        
        # Приоритизируем mt6739-специфичные пути
        grep -E "mt6739" /tmp/mtk_clean.txt > /tmp/mtk_pri.txt || true
        grep -vE "mt6739" /tmp/mtk_clean.txt > /tmp/mtk_rest.txt || true
        
        # Увеличили cap с 250 до 500 — иначе ComboA выпадает
        # ~500 путей × ~80 байт = ~40 КБ, до ARG_MAX (~128 КБ) ещё далеко
        cat /tmp/mtk_pri.txt /tmp/mtk_rest.txt | head -500 > /tmp/mtk_final.txt
        echo "Capped to $(wc -l < /tmp/mtk_final.txt) paths"
        
        # Проверяем, что ComboA попал в список
        grep -c "ComboA" /tmp/mtk_final.txt || echo "WARNING: ComboA not in list!"
        
        # Добавляем в корневой Makefile как KBUILD_CFLAGS
        echo "" >> Makefile
        echo "# Alpine port: auto-collected MTK include paths" >> Makefile
        while read -r d; do
          echo "KBUILD_CFLAGS += -I\$(srctree)/$d" >> Makefile
        done < /tmp/mtk_final.txt
        
        echo "=== Makefile tail ==="
        tail -5 Makefile
        echo "=== Total KBUILD_CFLAGS added ==="
        grep -c "KBUILD_CFLAGS += -I" Makefile

    - name: Build kernel
      id: build
      continue-on-error: true
      run: |
        export ARCH=arm64
        export CROSS_COMPILE="$TOOLCHAIN_DIR/bin/aarch64-linux-android-"
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"
        export KBUILD_BUILD_USER="builder"
        export KBUILD_BUILD_HOST="localhost"
        export KBUILD_BUILD_VERSION="1"
        
        echo "=== Using toolchain ==="
        ${CROSS_COMPILE}gcc --version | head -1
        
        # KCFLAGS — минимум для старого GCC 4.9.4.
        # Большинство -Wno-error не нужно (GCC 4.9 просто игнорирует
        # неизвестные -Wno-*), но оставляем ключевые на случай edge cases.
        # ВАЖНО: каждая строка заканчивается на \ (кроме последней).
        export KCFLAGS="-Wno-error \
          -I\$(srctree)"
        
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}

    - name: Show errors (if build failed)
      if: steps.build.outcome == 'failure'
      run: |
        echo "=== First errors ==="
        grep -n -m20 -E "error:|fatal error" build.log || true
        echo
        echo "=== Context around first error ==="
        FIRST=$(grep -n -m1 -E "error:|fatal error" build.log | cut -d: -f1)
        if [ -n "$FIRST" ]; then
          START=$((FIRST-10)); [ $START -lt 1 ] && START=1
          sed -n "${START},$((FIRST+15))p" build.log
        fi

    - name: Upload kernel
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: a01core-Image.gz-dtb
        path: arch/arm64/boot/Image.gz-dtb

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
