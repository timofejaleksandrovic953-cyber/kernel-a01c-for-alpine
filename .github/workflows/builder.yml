name: Build A01 Core Kernel

on:
  push:
    branches: [ main ]
    paths:
      - 'a01core.config'
      - 'arch/arm64/boot/dts/**'
      - 'drivers/misc/mediatek/**'
      - 'include/**'
      - 'kernel/**'
      - '.github/workflows/builder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: timofejaleksandrovic953-cyber/kernel-a01c-for-alpine
        ref: main

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev \
          make python3 git wget xz-utils ccache \
          perl libxml-simple-perl libxml-libxml-perl \
          libparse-yapp-perl libdbi-perl

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.ref }}-a01core
        max-size: 2G

    - name: Download old GCC 4.9 toolchain
      run: |
        set -e
        URLS=(
          "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
          "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
        )
        
        CLONED=0
        for url in "${URLS[@]}"; do
          echo "=== Trying: $url ==="
          rm -rf toolchain-repo
          if git clone --depth=1 "$url" toolchain-repo 2>&1; then
            if [ -d "toolchain-repo/bin" ] && \
               ls toolchain-repo/bin/aarch64-linux-android-gcc* >/dev/null 2>&1; then
              echo "=== SUCCESS: binaries present ==="
              CLONED=1
              break
            else
              echo "=== Cloned but no gcc binary — trying next ==="
              ls -la toolchain-repo/ | head -10
            fi
          fi
        done
        
        if [ "$CLONED" -ne 1 ]; then
          echo "=== FAILED: could not obtain toolchain ==="
          exit 1
        fi
        
        TOOLCHAIN_BIN="$(pwd)/toolchain-repo/bin"
        echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV
        
        echo "=== GCC version ==="
        "$TOOLCHAIN_BIN/aarch64-linux-android-gcc" --version | head -1

    - name: Clean working tree
      run: |
        rm -rf include/config include/generated
        rm -rf arch/arm64/boot/Image*
        rm -f .config .config.old .version
        rm -f Module.symvers modules.order build.log
        find . -name "*.o" -not -path "./.git/*" -delete 2>/dev/null || true
        find . -name "*.cmd" -not -path "./.git/*" -delete 2>/dev/null || true
        find . -name "*.mod.c" -not -path "./.git/*" -delete 2>/dev/null || true
        echo "=== Cleaned ==="
        ls -la | head -10

    - name: Neutralize non-essential MTK dirs
      run: |
        DIRS="
          drivers/misc/mediatek/gpu
          drivers/misc/mediatek/eccci
          drivers/misc/mediatek/ccci_util
          drivers/misc/mediatek/modem
          drivers/misc/mediatek/base/power/cpufreq_v1
          drivers/misc/mediatek/base/power/cpufreq_v2
          drivers/misc/mediatek/base/power/mt_cpufreq
          drivers/misc/mediatek/base/power/mt_cpufreq_hybrid
          drivers/misc/mediatek/base/power/mt_cpufreq_hw
          drivers/misc/mediatek/base/power/eem_v1
          drivers/misc/mediatek/base/power/eem_v2
          drivers/misc/mediatek/base/power/eemgpu_v1
          drivers/misc/mediatek/base/power/eemgpu_v2
          drivers/misc/mediatek/base/power/mtk_eem
          drivers/misc/mediatek/base/power/eem
          drivers/misc/mediatek/base/power/mt6739
          drivers/misc/mediatek/cmdq/v2
          drivers/misc/mediatek/base/power/upower_v2
          drivers/misc/mediatek/base/power/upower
          drivers/misc/mediatek/conn_md
          drivers/misc/mediatek/connfem
          drivers/misc/mediatek/fmradio
          drivers/misc/mediatek/gps
        "
        
        for d in $DIRS; do
          if [ -d "$d" ]; then
            find "$d" -type f \( -name "*.c" -o -name "*.S" -o -name "*.o" \) -delete 2>/dev/null || true
            find "$d" -mindepth 2 -name "Makefile" -delete 2>/dev/null || true
            find "$d" -mindepth 2 -name "Kconfig" -delete 2>/dev/null || true
            printf '# Disabled for Alpine port\nobj-y := alpine_dummy.o\n' > "$d/Makefile"
            printf 'static int alpine_dummy __attribute__((unused));\n' > "$d/alpine_dummy.c"
            printf '# Disabled for Alpine port\n' > "$d/Kconfig"
            echo "Neutralized: $d"
          fi
        done

        rm -rf drivers/misc/mediatek/cmdq/v2
        rm -rf drivers/misc/mediatek/base/power/upower_v2
        rm -rf drivers/misc/mediatek/base/power/upower

        for mf in drivers/misc/mediatek/base/power/Makefile \
                  drivers/misc/mediatek/cmdq/Makefile; do
          if [ -f "$mf" ]; then
            sed -i '/upower/d; /cmdq\/v2/d' "$mf"
          fi
        done

    - name: Prepare kernel config
      run: |
        cp a01core.config .config

        scripts/config --file .config --set-str GT1151_FIRMWARE "firmware1"
        scripts/config --file .config --set-str GT1151_CONFIG  "config1"
        scripts/config --file .config --enable GTP_CUSTOM_CFG
        scripts/config --file .config --enable GTP_AUTO_UPDATE
        scripts/config --file .config --enable GTP_POWER_CTRL_SLEEP

        for opt in MTK_AEE_MRDUMP MTK_AEE_IPANIC MTK_AEE_AED \
                   SEC_DEBUG SEC_DEBUG_2 SEC_DEBUG_USER \
                   SEC_DEBUG_EXTRA_INFO SEC_DEBUG_PANIC_ALWAYS \
                   SEC_DEBUG_SOFTLOCKUP_DETECTOR; do
          scripts/config --file .config --disable "$opt" 2>/dev/null || true
        done

        for opt in MTK_CCCI_DRIVER MTK_CCCI_DRIVER_MTK MTK_MD_CCIF \
                   MTK_RILD MTK_MD_POWER_OFF MTK_MODEM_SUPPORT \
                   MTK_CCCI_OPT MTK_MD1_SUPPORT MTK_MD2_SUPPORT \
                   MTK_CCCI_FS MTK_MD_CCIF_DRV \
                   MTK_CPU_FREQ MTK_CPU_FREQ_V1 MTK_CPU_FREQ_V2 \
                   MTK_CPUFREQ_SUPPORT MTK_CPU_FREQ_HW \
                   MTK_CPUFREQ_HYBRID MTK_CPUFREQ_PPM \
                   MTK_EEM_CONFIG MTK_EEM_V1 MTK_EEM_V2 MTK_EEM \
                   MTK_CPU_EEM MTK_EEM_MT6739 MTK_EEMGPU_CONFIG \
                   MTK_EEMGPU_V2 MTK_CPUISOLATION MTK_CPUIDLE_V2 \
                   MTK_PICACHU MTK_PTP MTK_UNIFY_POWER MTK_UPOWER; do
          scripts/config --file .config --disable "$opt" 2>/dev/null || true
        done

        scripts/config --file .config --disable CC_STACKPROTECTOR_STRONG || true
        scripts/config --file .config --disable CC_STACKPROTECTOR_REGULAR || true
        scripts/config --file .config --disable CC_STACKPROTECTOR || true

        scripts/config --file .config --set-str LOCALVERSION "-a01core"

        make ARCH=arm64 olddefconfig

        echo "=== Final config check ==="
        grep -E "GT1151|GTP_CUSTOM|MTK_AEE|MTK_CCCI|LOCALVERSION|STACKPROTECTOR" .config || true

    - name: Patch pinctrl include
      run: |
        F="drivers/pinctrl/mediatek/pinctrl-mtk-common-v2_debug.c"
        sed -i 's|^#include *[<"]\.\./\.\./gpio/gpiolib\.h[>"].*|#include <linux/gpio/driver.h>|' "$F"

    - name: Drop pinctrl debug file from build
      run: |
        MF="drivers/pinctrl/mediatek/Makefile"
        sed -i 's| pinctrl-mtk-common-v2_debug\.o||' "$MF"

    - name: Fix rpmb-mtk.c (mmc_queue definition)
      run: |
        F="drivers/char/rpmb/rpmb-mtk.c"
        grep -q "mmc/core/queue.h" "$F" || \
          sed -i '/#include <linux\/device.h>/a #include "../../mmc/core/queue.h"' "$F"

    - name: Fix ssbd.c is_compat_thread
      run: |
        F="arch/arm64/kernel/ssbd.c"
        sed -i '/fallback_is_compat_thread/d' "$F"
        sed -i '/#define is_compat_thread/d' "$F"
        LAST_INC=$(grep -n '^#include' "$F" | tail -1 | cut -d: -f1)
        awk -v line="$LAST_INC" '
        NR == line {
            print
            print ""
            print "#ifndef CONFIG_COMPAT"
            print "#define is_compat_thread(x) (false)"
            print "#endif"
            next
        }
        { print }
        ' "$F" > "$F.tmp" && mv "$F.tmp" "$F"

    - name: Fix all TRACE_INCLUDE_PATH dots
      run: |
        FILES=$(grep -rl '^#define TRACE_INCLUDE_PATH \.$' \
                drivers/misc/mediatek/ sound/ 2>/dev/null || true)
        if [ -n "$FILES" ]; then
          echo "$FILES" | while read -r f; do
            DIR=$(dirname "$f")
            sed -i "s|^#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH $DIR|" "$f"
          done
        fi

    - name: Auto-collect MTK include paths
      run: |
        find drivers/misc/mediatek drivers/staging/android/ion \
             sound/soc/mediatek drivers/mmc/host/mediatek \
             drivers/pinctrl/mediatek \
             -type f -name "*.h" 2>/dev/null \
          | xargs -n1 dirname | sort -u > /tmp/mtk_all.txt
        
        grep -vE "Documentation|/tools/|/test|/cmdq/v2/|/upower_v2/|/cpufreq_v[12]/|/eem_|wlan_drv_gen2|wmt_drv|wmt_chrdev" \
          /tmp/mtk_all.txt > /tmp/mtk_clean.txt || cp /tmp/mtk_all.txt /tmp/mtk_clean.txt
        
        grep -E "mt6739" /tmp/mtk_clean.txt > /tmp/mtk_pri.txt || true
        grep -vE "mt6739" /tmp/mtk_clean.txt > /tmp/mtk_rest.txt || true
        
        cat /tmp/mtk_pri.txt /tmp/mtk_rest.txt | head -500 > /tmp/mtk_final.txt
        
        echo "" >> Makefile
        echo "# Alpine port: auto-collected MTK include paths" >> Makefile
        while read -r d; do
          echo "KBUILD_CFLAGS += -I\$(srctree)/$d" >> Makefile
        done < /tmp/mtk_final.txt

    - name: Scope wlan include paths + DBGLOG fallback
      run: |
        FALLBACK="drivers/misc/mediatek/connectivity/wlan_drv_gen2/include/alpine_dbglog_fallback.h"
        
        printf '%s\n' \
          '#ifndef ALPINE_DBGLOG_FALLBACK_H' \
          '#define ALPINE_DBGLOG_FALLBACK_H' \
          '' \
          '#ifndef DBGLOG' \
          '#define DBGLOG(...) do { } while (0)' \
          '#endif' \
          '' \
          '#ifndef DBGLOGLIMITED' \
          '#define DBGLOGLIMITED(...) do { } while (0)' \
          '#endif' \
          '' \
          '#ifndef DBGLOG_MEM8' \
          '#define DBGLOG_MEM8(...) do { } while (0)' \
          '#endif' \
          '' \
          '#ifndef DBGLOG_MEM32' \
          '#define DBGLOG_MEM32(...) do { } while (0)' \
          '#endif' \
          '' \
          '#ifndef ASSERT' \
          '#define ASSERT(...) do { } while (0)' \
          '#endif' \
          '' \
          '#endif' \
          > "$FALLBACK"
        
        MF="drivers/misc/mediatek/connectivity/wlan_drv_gen2/Makefile"
        [ -f "$MF" ] || MF="drivers/misc/mediatek/connectivity/wlan_drv_gen2/os/linux/Makefile"
        
        for L in \
          'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/wlan_drv_gen2/include' \
          'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/wlan_drv_gen2/os/linux/include' \
          'subdir-ccflags-y += -Wno-error' \
          'subdir-ccflags-y += -include $(srctree)/drivers/misc/mediatek/connectivity/wlan_drv_gen2/include/alpine_dbglog_fallback.h' \
        ; do
          grep -qF "$L" "$MF" || echo "$L" >> "$MF"
        done

    # ============================================================
    # Стабы для символов из нейтрализованных директорий.
    # Линкер не находит их в vmlinux, потому что драйверы удалены,
    # но код, вызывающий их, остался.
    # ============================================================
    - name: Add alpine stubs for neutralized symbols
      run: |
        printf '%s\n' \
          '#include <linux/kernel.h>' \
          '#include <linux/types.h>' \
          '' \
          'int gpio_get_tristate_input(unsigned int pin) { return 0; }' \
          'int mtk_conn_md_bridge_reg(unsigned int a, unsigned int b) { return 0; }' \
          'int mtk_conn_md_bridge_unreg(unsigned int a, unsigned int b) { return 0; }' \
          'int mtk_conn_md_bridge_send_msg(void *a, unsigned int b, void *c) { return 0; }' \
          'unsigned int mt_cpufreq_get_freq_by_idx(unsigned int cluster, unsigned int idx) { return 0; }' \
          > init/alpine_stubs.c
        
        echo "obj-y += alpine_stubs.o" >> init/Makefile
        echo "=== init/Makefile tail ==="
        tail -3 init/Makefile
        echo "=== alpine_stubs.c ==="
        cat init/alpine_stubs.c

    - name: Build kernel
      id: build
      continue-on-error: true
      run: |
        export ARCH=arm64
        export CC="ccache $TOOLCHAIN_BIN/aarch64-linux-android-gcc"
        export CROSS_COMPILE="$TOOLCHAIN_BIN/aarch64-linux-android-"
        export PATH="$TOOLCHAIN_BIN:$PATH"
        
        if [ -z "$TOOLCHAIN_BIN" ] || [ ! -x "$TOOLCHAIN_BIN/aarch64-linux-android-gcc" ]; then
          echo "FATAL: Toolchain not found at $TOOLCHAIN_BIN"
          exit 1
        fi
        
        echo "=== Toolchain check ==="
        ${CROSS_COMPILE}gcc --version | head -1
        
        GCC_VER=$(${CROSS_COMPILE}gcc -dumpversion)
        echo "Detected GCC version: $GCC_VER"
        
        export KBUILD_BUILD_USER="builder"
        export KBUILD_BUILD_HOST="localhost"
        export KBUILD_BUILD_VERSION="1"
        
        export KCFLAGS="-Wno-error \
          -Wno-error=implicit-function-declaration \
          -Wno-error=unused-variable \
          -Wno-error=maybe-uninitialized \
          -Wno-error=unused-but-set-variable \
          -Wno-error=undef \
          -Wno-error=address \
          -Wno-error=array-bounds \
          -I\$(srctree) \
          -I\$(srctree)/drivers/mmc/host/mediatek/ComboA \
          -I\$(srctree)/drivers/mmc/host/mediatek/ComboA/mt6739 \
          -I\$(srctree)/drivers/misc/mediatek/mmp \
          -I\$(srctree)/drivers/staging/android/ion \
          -I\$(srctree)/drivers/staging/android/ion/mtk \
          -I\$(srctree)/drivers/misc/mediatek/leds \
          -I\$(srctree)/drivers/misc/mediatek/leds/mt6739 \
          -I\$(srctree)/drivers/watchdog/mediatek/wdt/common/wdt_v2 \
          -I\$(srctree)/drivers/misc/mediatek/smi \
          -I\$(srctree)/drivers/misc/mediatek/timer/timesync \
          -I\$(srctree)/drivers/misc/mediatek/video/mt6739/videox \
          -I\$(srctree)/drivers/misc/mediatek/video/mt6739 \
          -I\$(srctree)/drivers/misc/mediatek/video/common \
          -I\$(srctree)/drivers/misc/mediatek/video/common/layering_rule_base/v1 \
          -I\$(srctree)/drivers/misc/mediatek/video/common/layering_rule_base"
        
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}

    - name: Show errors (if build failed)
      if: steps.build.outcome == 'failure'
      run: |
        echo "=== First errors ==="
        grep -n -m20 -E "error:|fatal error|undefined reference" build.log || true
        echo
        echo "=== Context around first error ==="
        FIRST=$(grep -n -m1 -E "error:|fatal error|undefined reference" build.log | cut -d: -f1)
        if [ -n "$FIRST" ]; then
          START=$((FIRST-10)); [ $START -lt 1 ] && START=1
          sed -n "${START},$((FIRST+15))p" build.log
        fi

    - name: Upload kernel
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: a01core-Image.gz-dtb
        path: arch/arm64/boot/Image.gz-dtb

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
