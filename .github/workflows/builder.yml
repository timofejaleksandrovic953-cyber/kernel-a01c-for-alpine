name: Build A01 Core Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: timofejaleksandrovic953-cyber/kernel-a01c-for-alpine
        ref: main

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          bc bison flex libssl-dev \
          make python3 git \
          perl libxml-simple-perl libxml-libxml-perl \
          libparse-yapp-perl libdbi-perl

    - name: Prepare kernel config
      run: |
        cp a01core.config .config

        # GT1151 (тачскрин)
        scripts/config --file .config --set-str GT1151_FIRMWARE "firmware1"
        scripts/config --file .config --set-str GT1151_CONFIG  "config1"
        scripts/config --file .config --enable GTP_CUSTOM_CFG
        scripts/config --file .config --enable GTP_AUTO_UPDATE
        scripts/config --file .config --enable GTP_POWER_CTRL_SLEEP

        # Отключаем Android-only (может не сработать из-за select — тогда патчим include)
        scripts/config --file .config --disable MTK_AEE_MRDUMP || true
        scripts/config --file .config --disable MTK_AEE_IPANIC || true
        scripts/config --file .config --disable MTK_AEE_AED    || true
        scripts/config --file .config --disable SEC_DEBUG || true
        scripts/config --file .config --disable SEC_DEBUG_2 || true
        scripts/config --file .config --disable SEC_DEBUG_USER || true
        scripts/config --file .config --disable SEC_DEBUG_EXTRA_INFO || true
        scripts/config --file .config --disable SEC_DEBUG_PANIC_ALWAYS || true
        scripts/config --file .config --disable SEC_DEBUG_SOFTLOCKUP_DETECTOR || true

        make ARCH=arm64 olddefconfig

        echo "=== Final config check ==="
        grep -E "GT1151|GTP_CUSTOM|MTK_AEE" .config || true

    - name: Patch pinctrl include
      run: |
        # Единственный реальный патч: приватный <../../gpio/gpiolib.h> → публичный
        # В файле угловые скобки <>, поэтому матчим и <>, и "".
        F="drivers/pinctrl/mediatek/pinctrl-mtk-common-v2_debug.c"
        echo "=== Before ==="
        grep -n 'gpiolib' "$F" || true
        sed -i 's|^#include *[<"]\.\./\.\./gpio/gpiolib\.h[>"].*|#include <linux/gpio/driver.h>|' "$F"
        echo "=== After ==="
        grep -n 'gpiolib\|linux/gpio/driver' "$F" || true

    - name: Drop pinctrl debug file from build
      run: |
        MF="drivers/pinctrl/mediatek/Makefile"
        echo "=== Before ==="
        grep "PARIS" "$MF"
        # Убираем только pinctrl-mtk-common-v2_debug.o, оставляя paris и common-v2
        sed -i 's| pinctrl-mtk-common-v2_debug\.o||' "$MF"
        echo "=== After ==="
        grep "PARIS" "$MF"

    - name: Fix TRACE_INCLUDE_PATH in modem_cldma_events.h
      run: |
        F="drivers/misc/mediatek/eccci/hif/modem_cldma_events.h"
        echo "=== Before ==="
        grep -n "TRACE_INCLUDE_PATH\|TRACE_INCLUDE_FILE" "$F"
        
        # Заменяем "." на путь ОТ КОРНЯ ядра (без ../../)
        sed -i 's|^#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH drivers/misc/mediatek/eccci/hif|' "$F"
        
        echo "=== After ==="
        grep -n "TRACE_INCLUDE_PATH\|TRACE_INCLUDE_FILE" "$F"

    - name: Build kernel
      id: build
      continue-on-error: true
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # KCFLAGS — стандартный способ. $(srctree) — переменная make,
        # экранируем \$, чтобы shell её не трогал.
        export KCFLAGS="-Wno-error=array-bounds \
          -Wno-error=implicit-function-declaration \
          -Wno-error=array-compare \
          -Wno-error=unused-variable \
          -Wno-error=zero-length-bounds \
          -Wno-error=stringop-overflow \
          -Wno-error=stringop-overread \
          -Wno-error=stringop-truncation \
          -Wno-error=format-truncation \
          -Wno-error=maybe-uninitialized \
          -Wno-error=misleading-indentation \
          -Wno-error=dangling-pointer \
          -Wno-error=address \
          -Wno-error=shift-negative-value \
          -Wno-error=unused-but-set-variable \
          -Wno-error=restrict \
          -Wno-error=undef \
          -Wno-error=enum-int-mismatch \
          -Wno-error=incompatible-pointer-types \
          -Wno-error=sizeof-array-div \
          -Wno-error=pointer-compare \
          -I\$(srctree)/drivers/misc/mediatek/cmdq/v3/mt6739 \
          -I\$(srctree)/drivers/misc/mediatek/eccci \
          -I\$(srctree)/drivers/misc/mediatek/aee/mrdump \
          -I\$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6739 \
          -I\$(srctree)/drivers/misc/mediatek/base/power/spm_v4 \
          -I\$(srctree)/drivers/mmc/host/mediatek/ComboA \
          -I\$(srctree)/drivers/mmc/host/mediatek/ComboA/mt6739 \
          -I\$(srctree)/drivers/pinctrl/mediatek \
          -I\$(srctree)/drivers/misc/mediatek/eccci/hif \
          -I\$(srctree)/drivers/misc/mediatek/freqhopping \
          -I\$(srctree)/drivers/misc/mediatek/leds \
          -I\$(srctree)/drivers/staging/android/ion \
          -I\$(srctree)/drivers/misc/mediatek/freqhopping/mt6739 \
          -I\$(srctree)/drivers/watchdog/mediatek/wdt/common/wdt_v2 \
          -I\$(srctree)/drivers/misc/mediatek/leds/mt6739 \
          -I\$(srctree)/drivers/misc/mediatek/m4u/mt6739"
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}

    - name: Show errors (if build failed)
      if: steps.build.outcome == 'failure'
      run: |
        echo "=== First errors ==="
        grep -n -m20 -E "error:|fatal error" build.log || true
        echo
        echo "=== Context around first error ==="
        FIRST=$(grep -n -m1 -E "error:|fatal error" build.log | cut -d: -f1)
        if [ -n "$FIRST" ]; then
          START=$((FIRST-10)); [ $START -lt 1 ] && START=1
          sed -n "${START},$((FIRST+15))p" build.log
        fi

    - name: Upload kernel
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: a01core-Image.gz-dtb
        path: arch/arm64/boot/Image.gz-dtb

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
