name: Build A01 Core Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: Takumi123w/kernel-a01c
        ref: main

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          bc bison flex libssl-dev \
          make python3 git

    - name: Apply custom config
      run: |
        # Если у вас есть config.gz, распакуйте его и положите в корень как .config
        # Здесь используем defconfig из репозитория как основу
        make ARCH=arm64 a01core_defconfig
        # Включаем драйвер тачскрина GT1151 (если он есть в Kconfig)
        # scripts/config --enable TOUCHSCREEN_MTK_GT1151
        make ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) Image.gz-dtb

    - name: Build kernel modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) modules

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: a01core-kernel
        path: |
          arch/arm64/boot/Image.gz-dtb
          drivers/input/touchscreen/**/*.ko
